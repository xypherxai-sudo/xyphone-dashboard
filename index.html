<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xyphone Dashboard</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:#0f0f1a; color:white; min-height:100vh; }

    /* LOGIN */
    #loginScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1rem; }
    .login-box { background:#1a1a2e; border:1px solid rgba(124,58,237,0.3); border-radius:24px; padding:2.5rem; width:100%; max-width:380px; text-align:center; }
    .login-logo { font-size:2.5rem; margin-bottom:0.5rem; }
    .login-box h1 { font-size:1.4rem; font-weight:800; margin-bottom:0.3rem; }
    .login-box p { color:rgba(255,255,255,0.4); font-size:0.9rem; margin-bottom:2rem; }
    .login-box input { width:100%; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:0.9rem 1rem; color:white; font-size:1rem; font-family:inherit; outline:none; margin-bottom:0.8rem; }
    .login-box input:focus { border-color:rgba(124,58,237,0.6); }
    .login-btn { width:100%; background:linear-gradient(135deg,#7c3aed,#5b21b6); color:white; border:none; border-radius:12px; padding:1rem; font-size:1rem; font-weight:700; font-family:inherit; cursor:pointer; }
    .login-error { color:#f87171; font-size:0.85rem; margin-top:0.5rem; display:none; }

    /* DASHBOARD */
    #dashboard { display:none; }
    
    /* HEADER */
    .header { background:#1a1a2e; border-bottom:1px solid rgba(124,58,237,0.2); padding:1rem 1.5rem; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
    .header-left { display:flex; align-items:center; gap:12px; }
    .header-logo { font-size:1.3rem; font-weight:900; color:#a78bfa; }
    .header-restaurant { font-size:0.9rem; color:rgba(255,255,255,0.5); }
    .header-right { display:flex; align-items:center; gap:12px; }
    .status-dot { width:10px; height:10px; border-radius:50%; background:#00c48c; animation:pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
    .logout-btn { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:rgba(255,255,255,0.5); border-radius:8px; padding:0.4rem 0.8rem; font-size:0.8rem; cursor:pointer; font-family:inherit; }

    /* STATS BAR */
    .stats { display:flex; gap:1rem; padding:1.2rem 1.5rem; background:#13132a; border-bottom:1px solid rgba(124,58,237,0.1); flex-wrap:wrap; }
    .stat-item { background:rgba(255,255,255,0.04); border:1px solid rgba(124,58,237,0.2); border-radius:12px; padding:0.8rem 1.2rem; min-width:120px; }
    .stat-item .num { font-size:1.6rem; font-weight:900; color:#a78bfa; }
    .stat-item .label { font-size:0.75rem; color:rgba(255,255,255,0.4); margin-top:2px; }

    /* FILTERS */
    .filters { padding:1rem 1.5rem; display:flex; gap:0.6rem; flex-wrap:wrap; align-items:center; }
    .filter-btn { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); color:rgba(255,255,255,0.6); border-radius:99px; padding:0.4rem 1rem; font-size:0.85rem; cursor:pointer; font-family:inherit; transition:all 0.2s; }
    .filter-btn.active { background:rgba(124,58,237,0.25); border-color:rgba(124,58,237,0.5); color:#a78bfa; }
    .refresh-btn { margin-left:auto; background:rgba(124,58,237,0.15); border:1px solid rgba(124,58,237,0.3); color:#a78bfa; border-radius:99px; padding:0.4rem 1rem; font-size:0.85rem; cursor:pointer; font-family:inherit; }

    /* ORDERS */
    .orders { padding:0 1.5rem 2rem; display:flex; flex-direction:column; gap:0.8rem; }
    .order-card { background:#1a1a2e; border:1px solid rgba(124,58,237,0.2); border-radius:16px; padding:1.2rem; transition:all 0.2s; }
    .order-card.neu { border-left:3px solid #f59e0b; }
    .order-card.fertig { border-left:3px solid #00c48c; opacity:0.6; }
    .order-card.abgebrochen { border-left:3px solid #ef4444; opacity:0.5; }
    .order-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:0.7rem; }
    .order-badge { font-size:0.7rem; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; padding:3px 10px; border-radius:99px; }
    .badge-neu { background:rgba(245,158,11,0.15); color:#f59e0b; border:1px solid rgba(245,158,11,0.3); }
    .badge-fertig { background:rgba(0,196,140,0.15); color:#00c48c; border:1px solid rgba(0,196,140,0.3); }
    .badge-abgebrochen { background:rgba(239,68,68,0.15); color:#ef4444; border:1px solid rgba(239,68,68,0.3); }
    .order-time { font-size:0.78rem; color:rgba(255,255,255,0.3); }
    .order-type { display:inline-flex; align-items:center; gap:4px; font-size:0.75rem; color:rgba(255,255,255,0.4); background:rgba(255,255,255,0.05); padding:2px 8px; border-radius:6px; }
    .order-name { font-weight:700; font-size:1rem; margin-bottom:0.3rem; }
    .order-items { color:rgba(255,255,255,0.7); font-size:0.9rem; line-height:1.5; margin-bottom:0.8rem; }
    .order-note { font-size:0.82rem; color:rgba(255,255,255,0.4); margin-bottom:0.8rem; }
    .order-actions { display:flex; gap:0.6rem; }
    .btn-fertig { background:linear-gradient(135deg,#00c48c,#00a070); color:white; border:none; border-radius:10px; padding:0.6rem 1.2rem; font-size:0.88rem; font-weight:700; cursor:pointer; font-family:inherit; flex:1; }
    .btn-abbrechen { background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); color:#ef4444; border-radius:10px; padding:0.6rem 1rem; font-size:0.85rem; cursor:pointer; font-family:inherit; }

    /* EMPTY STATE */
    .empty { text-align:center; padding:4rem 1rem; color:rgba(255,255,255,0.3); }
    .empty-icon { font-size:3rem; margin-bottom:1rem; }

    /* NOTIFICATION */
    .notif { position:fixed; top:80px; right:1rem; background:#1a1a2e; border:1px solid rgba(124,58,237,0.4); border-radius:14px; padding:1rem 1.2rem; font-size:0.9rem; z-index:1000; animation:slideIn 0.3s ease; box-shadow:0 8px 30px rgba(124,58,237,0.3); max-width:300px; }
    @keyframes slideIn { from{transform:translateX(120%);opacity:0} to{transform:translateX(0);opacity:1} }

    /* BELL ANIMATION */
    .bell { font-size:1.4rem; animation:ringBell 0.5s ease 3; }
    @keyframes ringBell { 0%,100%{transform:rotate(0)} 25%{transform:rotate(20deg)} 75%{transform:rotate(-20deg)} }

    @media(max-width:480px) {
      .stats { gap:0.6rem; }
      .stat-item { min-width:90px; padding:0.6rem 0.8rem; }
      .stat-item .num { font-size:1.3rem; }
      .header { padding:0.8rem 1rem; }
      .orders { padding:0 1rem 2rem; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">🍕</div>
    <h1>Xyphone Dashboard</h1>
    <p>Melde dich an um deine Bestellungen zu sehen</p>
    <input type="text" id="loginUser" placeholder="Benutzername" />
    <input type="password" id="loginPass" placeholder="Passwort" onkeydown="if(event.key==='Enter')doLogin()" />
    <button class="login-btn" onclick="doLogin()">Anmelden →</button>
    <div class="login-error" id="loginError">❌ Falscher Benutzername oder Passwort</div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="header">
    <div class="header-left">
      <div class="header-logo">🤖 Xyphone</div>
      <div class="header-restaurant" id="headerRestaurant">—</div>
    </div>
    <div class="header-right">
      <span class="status-dot" title="Live"></span>
      <span id="bellIcon" style="font-size:1.3rem;">🔔</span>
      <button class="logout-btn" onclick="doLogout()">Abmelden</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat-item">
      <div class="num" id="statNeu">0</div>
      <div class="label">Neue Bestellungen</div>
    </div>
    <div class="stat-item">
      <div class="num" id="statHeute">0</div>
      <div class="label">Heute gesamt</div>
    </div>
    <div class="stat-item">
      <div class="num" id="statFertig">0</div>
      <div class="label">Erledigt heute</div>
    </div>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('alle', this)">Alle</button>
    <button class="filter-btn" onclick="setFilter('neu', this)">🟡 Neu</button>
    <button class="filter-btn" onclick="setFilter('fertig', this)">✅ Fertig</button>
    <button class="filter-btn" onclick="setFilter('lieferung', this)">🚗 Lieferung</button>
    <button class="filter-btn" onclick="setFilter('abholung', this)">🏃 Abholung</button>
    <button class="refresh-btn" onclick="loadOrders()">🔄 Aktualisieren</button>
  </div>

  <div class="orders" id="ordersList"></div>
</div>

<script>
const SUPABASE_URL = 'https://llrnusfadlazswgudxjt.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxscm51c2ZhZGxhenN3Z3VkeGp0Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NTE1NjY1MywiZXhwIjoyMDkwNzMyNjUzfQ.LkBEymbvVeok8qt2Fj_DCogZzp6jhdE0RFYs1L4mv2k';

// Simple user DB (extend later)
const USERS = {
  'pizzeria_latina': { pass: 'latina123', name: 'Pizzeria Latina', rid: 'pizzeria_latina' },
  'pizzeria_lolipop': { pass: 'test1234', name: 'Pizzeria Lolipop', rid: 'pizzeria_lolipop' },
  'admin': { pass: 'xyphone2026', name: 'Admin', rid: null }
};

let currentUser = null;
let currentFilter = 'alle';
let allOrders = [];
let lastOrderCount = 0;
let pollInterval = null;

function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value.trim();
  const user = USERS[u];
  if (user && user.pass === p) {
    currentUser = { ...user, username: u };
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('headerRestaurant').textContent = user.name;
    loadOrders();
    // Poll every 10 seconds
    pollInterval = setInterval(loadOrders, 10000);
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
}

function doLogout() {
  currentUser = null;
  if (pollInterval) clearInterval(pollInterval);
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
}

async function loadOrders() {
  if (!currentUser) return;
  
  let url = `${SUPABASE_URL}/rest/v1/orders?order=created_at.desc&limit=50`;
  if (currentUser.rid) url += `&restaurant_id=eq.${currentUser.rid}`;

  try {
    const res = await fetch(url, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    allOrders = await res.json();
    if (!Array.isArray(allOrders)) { allOrders = []; }
    
    // Check for new orders
    const neuCount = allOrders.filter(o => o.status === 'neu').length;
    if (neuCount > lastOrderCount && lastOrderCount > 0) {
      showNotification(`🔔 Neue Bestellung eingegangen!`);
      ringBell();
    }
    lastOrderCount = neuCount;
    
    updateStats();
    renderOrders();
  } catch(e) {
    console.error(e);
  }
}

function updateStats() {
  const heute = new Date().toDateString();
  const heuteOrders = allOrders.filter(o => new Date(o.created_at).toDateString() === heute);
  document.getElementById('statNeu').textContent = allOrders.filter(o => o.status === 'neu').length;
  document.getElementById('statHeute').textContent = heuteOrders.length;
  document.getElementById('statFertig').textContent = heuteOrders.filter(o => o.status === 'fertig').length;
}

function renderOrders() {
  const list = document.getElementById('ordersList');
  let filtered = allOrders;
  
  if (currentFilter === 'neu') filtered = allOrders.filter(o => o.status === 'neu');
  else if (currentFilter === 'fertig') filtered = allOrders.filter(o => o.status === 'fertig');
  else if (currentFilter === 'lieferung') filtered = allOrders.filter(o => o.typ === 'lieferung');
  else if (currentFilter === 'abholung') filtered = allOrders.filter(o => o.typ === 'abholung');

  if (!filtered.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">📭</div><p>Keine Bestellungen</p></div>`;
    return;
  }

  list.innerHTML = filtered.map(o => `
    <div class="order-card ${o.status}" id="card-${o.id}">
      <div class="order-header">
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="order-badge badge-${o.status}">${o.status === 'neu' ? '🟡 Neu' : o.status === 'fertig' ? '✅ Fertig' : '❌ Abgebrochen'}</span>
          <span class="order-type">${o.typ === 'lieferung' ? '🚗 Lieferung' : '🏃 Abholung'}</span>
        </div>
        <span class="order-time">${formatTime(o.created_at)}</span>
      </div>
      <div class="order-name">${o.kunde || 'Unbekannt'}</div>
      <div class="order-items">${o.artikel}</div>
      ${o.notiz ? `<div class="order-note">📝 ${o.notiz}</div>` : ''}
      ${o.status === 'neu' ? `
        <div class="order-actions">
          <button class="btn-fertig" onclick="updateStatus(${o.id}, 'fertig')">✅ Fertig</button>
          <button class="btn-abbrechen" onclick="updateStatus(${o.id}, 'abgebrochen')">✕</button>
        </div>` : ''}
    </div>
  `).join('');
}

async function updateStatus(id, status) {
  await fetch(`${SUPABASE_URL}/rest/v1/orders?id=eq.${id}`, {
    method: 'PATCH',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify({ status })
  });
  loadOrders();
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderOrders();
}

function formatTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  const diff = Math.floor((now - d) / 60000);
  if (diff < 1) return 'Gerade eben';
  if (diff < 60) return `vor ${diff} Min.`;
  return d.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
}

function showNotification(msg) {
  const n = document.createElement('div');
  n.className = 'notif';
  n.textContent = msg;
  document.body.appendChild(n);
  setTimeout(() => n.remove(), 4000);
}

function ringBell() {
  const bell = document.getElementById('bellIcon');
  bell.className = 'bell';
  setTimeout(() => bell.className = '', 1500);
}
</script>
</body>
</html>
